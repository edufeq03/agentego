version: '3.8'

services:
  db-homolog:
    image: postgres:15
    container_name: agentego-db-homolog
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_homolog:/var/lib/postgresql/data

  bot-homolog:
    build: ./bot-service
    container_name: agentego-bot-homolog
    restart: always
    env_file: .env.homolog
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-homolog:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-homolog:6379/0
    ports:
      - "8001:8000"
    depends_on:
      - db-homolog
      - redis-homolog
    volumes:
      - ./bot-service:/app

  dashboard-homolog:
    build: ./dashboard
    container_name: agentego-dashboard-homolog
    restart: always
    env_file: .env.homolog
    ports:
      - "3001:3000"
    depends_on:
      - bot-homolog

  redis-homolog:
    image: redis:7-alpine
    container_name: agentego-redis-homolog
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  postgres_data_homolog:
