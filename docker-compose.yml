version: '3.8'

services:
  db:
    image: postgres:15
    container_name: atendia-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: ./bot-service
    container_name: atendia-bot
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-atendimento}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./bot-service:/app

  dashboard:
    build: ./dashboard
    container_name: atendia-dashboard
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - bot

  redis:
    image: redis:7-alpine
    container_name: atendia-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-mudar_senha_redis}
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
